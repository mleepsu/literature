<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>중학 과학 탐구</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- API Key Modal -->
  <div id="api-modal" class="modal active">
    <div class="modal-content">
      <div class="modal-icon">🔑</div>
      <h2>Google Gemini API 키 입력</h2>
      <p>과학 개념 설명과 이미지를 생성하려면 Gemini API 키가 필요합니다.</p>
      <a href="https://aistudio.google.com/apikey" target="_blank" class="api-link">API 키 발급받기 &rarr;</a>
      <input type="password" id="api-key-input" placeholder="API 키를 입력하세요" />
      <button id="api-key-submit" class="btn-primary">시작하기</button>
      <p class="note">* API 키는 브라우저에만 저장되며 외부로 전송되지 않습니다.</p>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="spinner"></div>
    <p id="loading-text">AI가 열심히 생각하고 있어요...</p>
  </div>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <h1>🔬 중학 과학 탐구</h1>
      <p class="subtitle">AI와 함께하는 과학 개념 학습</p>
      <button id="change-api-key" class="btn-sm" title="API 키 변경">⚙️ API 키</button>
    </div>
  </header>

  <!-- Main -->
  <main>
    <!-- Category Selection -->
    <section id="categories" class="section">
      <h2 class="section-title">과학 분야를 선택하세요</h2>
      <div class="category-grid">
        <button class="category-card" data-category="physics">
          <span class="category-icon">⚡</span>
          <span class="category-name">물리</span>
          <span class="category-desc">힘, 에너지, 전기, 파동</span>
        </button>
        <button class="category-card" data-category="chemistry">
          <span class="category-icon">🧪</span>
          <span class="category-name">화학</span>
          <span class="category-desc">물질, 원소, 화학반응</span>
        </button>
        <button class="category-card" data-category="biology">
          <span class="category-icon">🧬</span>
          <span class="category-name">생물</span>
          <span class="category-desc">세포, 생태계, 유전</span>
        </button>
        <button class="category-card" data-category="earth-science">
          <span class="category-icon">🌍</span>
          <span class="category-name">지구과학</span>
          <span class="category-desc">지질, 기상, 천문</span>
        </button>
      </div>
    </section>

    <!-- Topic Selection -->
    <section id="topics" class="section hidden">
      <button id="back-to-categories" class="btn-back">&larr; 분야 선택으로</button>
      <h2 class="section-title" id="topics-title">주제를 선택하세요</h2>
      <div class="topic-grid" id="topic-list"></div>
    </section>

    <!-- Concept Detail -->
    <section id="concept-detail" class="section hidden">
      <button id="back-to-topics" class="btn-back">&larr; 주제 목록으로</button>
      <div id="concept-content"></div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>Powered by Google Gemini AI | 중학교 과학 학습 도우미</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
